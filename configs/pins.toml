# Pinned environment for every experiment (spec #1, ADR-0003). See docs/environment.md.

[llama_cpp]
release_tag = "b11606"
commit = "1b70350c92563449576bcbbf552994b1d1ed847d"
asset = "llama-b11606-bin-win-cuda-13.4-x64.zip"
asset_sha256 = "93ba7c16d1ad8343248d540bb4c06e7e18f7d0601e762d6952bad13628295be8"
cudart_asset = "cudart-llama-bin-win-cuda-13.4-x64.zip"
cudart_asset_sha256 = "738f8c251ac22b70c3ae6f83a10cf222725df0395246a2cf58f32bdb85fbe668"
server_version = "0.6.0-dev (build 11606, commit 1b70350c9)"
# the source reading in spec #1 was done at ff026f8, the direct child of this commit
source_reading_commit = "ff026f8c0a97fe80649f34763432c9d40b418622"

[llama_cpp.linux]
# Linux (RunPod) has no pinned prebuilt: scripts/runpod-setup.sh builds `commit` from source,
# from a blobless clone so `llama-server --version` still reports build 11606. The script adds
# -DCMAKE_CUDA_ARCHITECTURES=<the GPU's compute capability> (the image's CMake 3.22 predates "native").
cmake_flags = [
    "-DGGML_CUDA=ON",
    "-DBUILD_SHARED_LIBS=OFF",
    "-DCMAKE_BUILD_TYPE=Release",
]

[model]
name = "Llama-3.2-3B-Instruct Q4_K_M"
hf_repo = "bartowski/Llama-3.2-3B-Instruct-GGUF"
hf_revision = "5ab33fa94d1d04e903623ae72c95d1696f09f9e8"
file = "Llama-3.2-3B-Instruct-Q4_K_M.gguf"
size_bytes = 2019377696
sha256 = "6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff"
kv_cache_type = "f16"

[machine.runpod]           # the sweep machine (ADR-0003); every compared experiment runs here
pod = "Secure Cloud, EU-RO-1, 1x GPU, ~5 vCPU (cgroup quota)"
gpu = "NVIDIA RTX 2000 Ada Generation (16380 MiB, compute capability 8.9)"
nvidia_driver = "580.159.04"
cuda_driver_api = "13.0"   # host CUDA version reported by RunPod
cuda_runtime = "12.4"      # nvcc 12.4.131 from the image, used to build llama-server
image = "runpod/pytorch:2.4.0-py3.11-cuda12.4.1-devel-ubuntu22.04"
compiler = "GNU 11.4.0"
python = "3.11.10"
uv = "0.13.0"

[machine]                  # the desktop (development; ADR-0002, superseded)
gpu = "NVIDIA GeForce RTX 3060 Ti (8192 MiB)"
nvidia_driver = "617.14"
cuda_driver_api = "13.4"   # "CUDA UMD Version" reported by nvidia-smi
cuda_runtime = "13.4"      # cudart shipped with the release asset
cpu = "AMD Ryzen 9 5900X"
ram_gb = 32
os = "Windows 10 Home 10.0.19045"
python = "3.11.0"
uv = "0.13.0"
