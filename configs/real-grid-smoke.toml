# A short grid against the real pinned llama-server (ticket #9): both FIFO baselines,
# one N, budget, rate, cache policy and seed, on the default mix (development workload).
# It proves the whole real path: sweep -> fresh servers per run -> run directories -> report.
#   python -m uv run agentserve sweep configs/real-grid-smoke.toml --out results/real-grid-smoke
#   python -m uv run agentserve report results/real-grid-smoke --out results/real-grid-smoke/report

[sweep]
seeds = [1]

[[grid]]
policy = ["task_level_fifo", "request_level_fifo"]
concurrency = [4]
memory_budget = [16384]
arrival_rate = [0.1]
cache_policy = ["resident"]

[base.run]
seed = 1
split = "dev"
warmup_s = 30             # arrivals in [0, 30) are the warm-up: run and logged, not measured
duration_s = 120          # measured arrivals in [30, 120); then drain

[base.workload]
mix = "default"
arrival_rate_per_s = 0.1

[base.policy]
name = "task_level_fifo"
concurrency = 4

[base.runtime]
kind = "llama_server"
request_timeout_s = 600
sample_interval_s = 0.1

[base.server]
binary = "${AGENTSERVE_ARTIFACTS}/llama.cpp/b11606/llama-server"
model = "${AGENTSERVE_ARTIFACTS}/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
host = "127.0.0.1"
port = 8093
memory_budget = 16384
slots = 4                 # the sweep sets slots = N
gpu_layers = 99
cache_ram_mib = 8192      # the runtime default host-RAM prompt cache
cache_idle_slots = false
cache_prompt = true
