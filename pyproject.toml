[project]
name = "agentserve"
version = "0.1.0"
description = "Memory-aware agent serving experiments (CSE 291A Option 1)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
]

[project.scripts]
agentserve = "agentserve.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_runtime'"
markers = [
    "real_runtime: needs a running pinned llama-server (opt in with -m real_runtime)",
]
